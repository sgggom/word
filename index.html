<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>字页 · Word Pages</title>
<meta name="description" content="书页风格的单词连线谜题：上下左右滑动字母，用尽每一块字砖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="i18n.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="skins-classic.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<script>
  // 皮肤：在页面渲染前套用，避免闪烁；各皮肤的字体按需加载
  window.SKINS = [
    {id:'book', name:'书页', icon:'Aa'},
    {id:'classic', name:'典藏', icon:'Aa'},
    {id:'typewriter', name:'复古打字机', icon:'A', font:'Special+Elite&family=Courier+Prime:wght@400;700'},
    {id:'keyboard', name:'键盘', icon:'A', font:'JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;700'},
    {id:'glass', name:'液态玻璃', icon:'A', font:'Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;700'},
    {id:'cartoon', name:'卡通', icon:'A', font:'Fredoka:wght@500;700&family=ZCOOL+KuaiLe'}
  ];
  window.applySkin = function(id){
    var sk = SKINS.filter(function(x){ return x.id === id; })[0] || SKINS[0];
    document.documentElement.setAttribute('data-skin', sk.id);
    if (sk.font && !document.getElementById('font-' + sk.id)) {
      var l = document.createElement('link');
      l.id = 'font-' + sk.id; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + sk.font + '&display=swap';
      document.head.appendChild(l);
    }
    if (window.syncIcons) syncIcons();
    try { localStorage.setItem('wordpages.skin', sk.id); } catch (e) {}
    return sk.id;
  };
  try { applySkin(localStorage.getItem('wordpages.skin') || 'book'); } catch (e) { applySkin('book'); }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20 4c-6 0-11 4-12.5 10L6 18.5M20 4c0 6-4 11-10 12.5M20 4 8.5 15.5M4 20l2-1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 11h7M9 14.5h7M9 18h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5.5C6 4 9 4 12 6c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5zM12 6v13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z" fill="currentColor"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="fleuron" viewBox="0 0 64 16"><path d="M2 8h18M44 8h18" stroke="currentColor" stroke-width="1"/><circle cx="23" cy="8" r="1.4" fill="currentColor"/><circle cx="41" cy="8" r="1.4" fill="currentColor"/><path d="M32 1c4 3 4 11 0 14c-4-3-4-11 0-14z" fill="currentColor"/></symbol>
  </defs>
</svg>
<!-- 典藏皮肤图标：切到 classic 时替换上面同名 symbol 的内容 -->
<svg id="sprite-classic" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="classic-i-feather" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21 15 10M7 17C4 9 12 2 21 3c0 9-7 17-14 14ZM10 14l-1-5m4 2 5 1"/></g></symbol>
    <symbol id="classic-i-spark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M12 3v5m0 8v5M3 12h5m8 0h5M5.6 5.6l3.5 3.5m5.8 5.8 3.5 3.5M5.6 18.4l3.5-3.5m5.8-5.8 3.5-3.5"/></g></symbol>
    <symbol id="classic-i-notes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H5V4q0-1 1-1ZM15 3v5h4M8 11h8m-8 4h6m-6 3h4"/></g></symbol>
    <symbol id="classic-i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2)"/></g></symbol>
    <symbol id="classic-i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2ZM6 8c1.5 0 2.5.4 3 1m6 0c.5-.6 1.5-1 3-1M6 12l3 1m6 0 3-1"/></g></symbol>
    <symbol id="classic-i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3 .5 2h3L14 3l3 1.5-.7 2 2.2 2.2 2-.7L22 11l-2 .5v3l2 .5-1.5 3-2-.7-2.2 2.2.7 2L14 23l-.5-2h-3L10 23l-3-1.5.7-2-2.2-2.2-2 .7L2 15l2-.5v-3L2 11l1.5-3 2 .7 2.2-2.2-.7-2Z" transform="translate(1 0) scale(.92)"/><circle cx="12" cy="12" r="3.3"/></g></symbol>
    <symbol id="classic-i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></g></symbol>
    <symbol id="classic-i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></g></symbol>
    <symbol id="classic-i-drop" viewBox="0 0 24 24"><g><path d="M12 2C10 6 5 11 5 15a7 7 0 0 0 14 0c0-4-5-9-7-13Z" fill="currentColor"/><path d="M8.5 14q-.8 2.6 1.6 3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round"/></g></symbol>
    <symbol id="classic-fleuron" viewBox="0 0 64 24"><g fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round"><path d="M3 12h12m34 0h12M18 12c5 0 8-4 14-4s9 4 14 4c-5 0-8 4-14 4s-9-4-14-4ZM32 8V3m0 13v5M26 8c-3-6-8-5-8-5 0 4 3 7 8 5Zm12 0c3-6 8-5 8-5 0 4-3 7-8 5Z"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="48" cy="12" r="1" fill="currentColor"/></g></symbol>
  </defs>
</svg>
<script>
  window.syncIcons = function(){
    var on = document.documentElement.getAttribute('data-skin') === 'classic';
    var alt = document.getElementById('sprite-classic'); if (!alt) return;
    alt.querySelectorAll('symbol').forEach(function(s){
      var t = document.getElementById(s.id.slice(8)); if (!t) return;
      if (!t._orig) t._orig = {html: t.innerHTML, vb: t.getAttribute('viewBox')};
      var src = on ? {html: s.innerHTML, vb: s.getAttribute('viewBox')} : t._orig;
      t.innerHTML = src.html; t.setAttribute('viewBox', src.vb);
    });
  };
  syncIcons();
</script>

<div id="app">

  <!-- 封面 -->
  <section id="home" class="screen active">
    <div class="cover">
      <div class="cover-frame">
        <div class="cover-orn"><svg class="fleuron" aria-hidden="true"><use href="#fleuron"/></svg></div>
        <h1 class="cover-title" data-i18n-html="cover.title">字&nbsp;页</h1>
        <div class="cover-sub" data-i18n-html="cover.sub">WORD&nbsp;&nbsp;TILES</div>
        <div class="cover-rule"></div>
        <p class="cover-tag" id="coverTag">一本关于字母的安静小书</p>
        <div class="cover-actions">
          <button class="plate primary" id="btnContinue"><span class="plate-main" data-i18n="cover.continue">继续阅读</span><span class="plate-sub" id="contSub">第 1 页</span></button>
          <button class="plate" id="btnToc" data-i18n="cover.toc">目 录</button>
          <button class="plate" id="btnDaily" data-i18n="cover.daily">每日一页</button>
          <button class="plate" id="btnDict" data-i18n="cover.dict">我的词典</button>
        </div>
        <div class="cover-foot">
          <span class="ink-count"><svg><use href="#i-drop"/></svg><b class="ink-val">0</b></span>
          <button class="icon-btn light" id="btnSettings" aria-label="设置" data-i18n-aria="aria.settings"><svg><use href="#i-gear"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 目录 -->
  <section id="toc" class="screen">
    <div class="sheet">
      <header class="sheet-head">
        <button class="icon-btn" data-back aria-label="返回" data-i18n-aria="aria.back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n-html="toc.title">目&nbsp;&nbsp;录</h2>
        <span class="ink-count"><svg><use href="#i-drop"/></svg><b class="ink-val">0</b></span>
      </header>
      <div class="sheet-body" id="tocList"></div>
    </div>
  </section>

  <!-- 每日一页 -->
  <section id="daily" class="screen">
    <div class="sheet narrow">
      <header class="sheet-head">
        <button class="icon-btn" data-back aria-label="返回" data-i18n-aria="aria.back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="daily.title">每日一页</h2>
        <span class="ink-count"><svg><use href="#i-drop"/></svg><b class="ink-val">0</b></span>
      </header>
      <div class="sheet-body daily-body">
        <div class="diary-date">
          <div class="diary-month" id="dMonth"></div>
          <div class="diary-day" id="dDay"></div>
          <div class="diary-week" id="dWeek"></div>
        </div>
        <div class="diary-stats">
          <div><b id="dStreak">0</b><span data-i18n="daily.streak">连续天数</span></div>
          <div><b id="dTotal">0</b><span data-i18n="daily.total">累计完成</span></div>
        </div>
        <div class="week-strip" id="dWeekStrip"></div>
        <button class="plate primary" id="btnDailyPlay">翻开今日一页</button>
      </div>
    </div>
  </section>

  <!-- 词典 -->
  <section id="dict" class="screen">
    <div class="sheet">
      <header class="sheet-head">
        <button class="icon-btn" data-back aria-label="返回" data-i18n-aria="aria.back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="dict.title">我的词典</h2>
        <span class="dict-count" id="dictCount"></span>
      </header>
      <div class="dict-search"><input id="dictQ" type="search" placeholder="查找已收录的单词…" data-i18n-ph="dict.search" autocomplete="off"></div>
      <div class="sheet-body" id="dictList"></div>
    </div>
  </section>

  <!-- 关卡编辑器（大厅按空格 / 长按封面标题） -->
  <section id="editor" class="screen">
    <div class="sheet wide">
      <header class="sheet-head">
        <button class="icon-btn" data-back aria-label="返回" data-i18n-aria="aria.back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="ed.title">关卡编辑器</h2>
        <span class="ed-hint" data-i18n="ed.esc">Esc 返回</span>
      </header>
      <div class="sheet-body ed-body">
        <div class="ed-col ed-board">
          <div class="ed-row">
            <span class="ed-label" data-i18n="ed.size">尺寸</span>
            <span class="stepper"><span data-i18n="ed.w">宽</span><button data-dim="W" data-d="-1">−</button><b id="edW">4</b><button data-dim="W" data-d="1">+</button></span>
            <span class="stepper"><span data-i18n="ed.h">高</span><button data-dim="H" data-d="-1">−</button><b id="edH">3</b><button data-dim="H" data-d="1">+</button></span>
          </div>
          <div class="ed-row">
            <span class="ed-label" data-i18n="ed.brush">画笔</span>
            <span class="seg" id="edMode">
              <button data-mode="letter" class="on" data-i18n="ed.letter">字母</button>
              <button data-mode="0" data-i18n="ed.curtA">幕布 A</button>
              <button data-mode="1" data-i18n="ed.curtB">幕布 B</button>
            </span>
            <label class="ed-req" id="edReqWrap" hidden><span data-i18n="ed.req1">揭开需</span> <input type="number" id="edReq" min="1" max="30" value="2"> <span data-i18n="ed.req2">词</span></label>
          </div>
          <div class="ed-grid-wrap"><div class="ed-grid" id="edGrid"></div></div>
          <div class="ed-row center">
            <button class="ed-btn" id="edRandom" data-i18n="ed.random">随机补全空格</button>
            <button class="ed-btn" id="edClearLetters" data-i18n="ed.clear">清空字母</button>
          </div>
          <ul class="ed-status" id="edStatus"></ul>
        </div>

        <div class="ed-col ed-side">
          <input class="ed-name" id="edName" placeholder="给这一页起个名字（可选）" data-i18n-ph="ed.name" maxlength="24" autocomplete="off">
          <div class="ed-sec"><span data-i18n-html="ed.words">词&nbsp;表</span><i id="edWordCount">0</i></div>
          <form class="ed-add" id="edAddForm" autocomplete="off">
            <input id="edWordIn" placeholder="输入单词，回车添加" data-i18n-ph="ed.wordIn" autocapitalize="characters" spellcheck="false">
            <button class="ed-btn" type="submit" data-i18n="ed.add">添加</button>
          </form>
          <div class="chips" id="edWords"></div>

          <div class="ed-sec"><span data-i18n="ed.onBoard">盘面中的单词</span><button class="text-btn" id="edScan" data-i18n="ed.rescan">重新查找</button></div>
          <div class="chips sugg" id="edSugg"></div>
          <div class="ed-tip"><span data-i18n="ed.clickAdd">点击加入词表；</span><button class="text-btn" id="edAllExtra" data-i18n="ed.allExtra">把剩下的都设为额外单词</button></div>

          <div class="ed-sec"><span data-i18n="ed.extras">额外单词</span><i id="edExtraCount">0</i></div>
          <div class="chips" id="edExtras"></div>

          <div class="ed-actions">
            <button class="plate primary" id="edPlay" data-i18n="ed.play">试 玩</button>
            <button class="plate" id="edSave" data-i18n="ed.save">保 存</button>
          </div>
          <div class="ed-row center small">
            <button class="text-btn" id="edNew" data-i18n="ed.new">新建</button>
            <button class="text-btn" id="edExport" data-i18n="ed.export">导出</button>
            <button class="text-btn" id="edImport" data-i18n="ed.import">导入</button>
          </div>

          <div class="ed-sec"><span data-i18n="ed.mine">我的关卡</span><i id="edSavedCount">0</i></div>
          <div class="ed-saved" id="edSaved"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 游戏 -->
  <section id="game" class="screen">
    <div class="book-wrap">
      <div class="book" id="book">
        <div class="page left" id="pageL">
          <header class="run-head">
            <button class="icon-btn" id="btnMenu" aria-label="目录" data-i18n-aria="aria.toc"><svg><use href="#i-book"/></svg></button>
            <span class="chap" id="chapTitle"></span>
            <span class="ink-count mobile-only"><svg><use href="#i-drop"/></svg><b class="ink-val">0</b></span>
          </header>
          <div class="list-title"><span data-i18n-html="game.words">词&nbsp;表</span><button class="info-btn" id="btnInfo" title="本页信息" data-i18n="game.info" data-i18n-title="game.info">本页信息</button><i id="listProg">0 / 0</i></div>
          <div class="words" id="words"></div>
          <div class="info" id="info" hidden></div>
          <div class="footnote" id="footnote"></div>
          <div class="folio desktop-only" id="folioL"></div>
        </div>
        <div class="page right" id="pageR">
          <header class="run-head">
            <span class="lvl" id="lvlTitle">第 1 页</span>
            <span class="tag-hard" id="tagHard" hidden></span>
            <span class="ink-count desktop-only"><svg><use href="#i-drop"/></svg><b class="ink-val">0</b></span>
          </header>
          <div class="current" id="current"><span class="cur-word" id="curWord"></span></div>
          <div class="grid-wrap" id="gridWrap">
            <div class="grid" id="grid"></div>
            <div class="tip" id="tip" hidden></div>
          </div>
          <nav class="toolbar">
            <button class="stamp" id="btnUndo" aria-label="撤回" data-i18n-aria="tool.undo"><svg><use href="#i-undo"/></svg><span data-i18n="tool.undo">撤回</span></button>
            <button class="stamp" id="btnExtras" aria-label="页边批注" data-i18n-aria="tool.notesAria"><svg><use href="#i-notes"/></svg><span data-i18n="tool.notes">批注</span><em class="badge" id="extraBadge">0</em></button>
            <button class="stamp" id="btnHint" aria-label="提示" data-i18n-aria="tool.hint"><svg><use href="#i-feather"/></svg><span data-i18n="tool.hint">提示</span><em class="cost">20</em></button>
            <button class="stamp" id="btnFire" aria-label="烟花" data-i18n-aria="tool.fire"><svg><use href="#i-spark"/></svg><span data-i18n="tool.fire">烟花</span><em class="cost">60</em></button>
          </nav>
          <div class="folio" id="folioR"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="mTitle"></h3>
      <div id="mBody"></div>
      <div class="modal-btns" id="mBtns"></div>
    </div>
  </div>
</div>

<script src="data/levels.js"></script>
<script src="data/dictionary.js"></script>
<script>
  // 参考关卡（从原版 APK 提取）只放在本地 data/reference/，不随仓库发布
  if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    document.write('<script src="data/reference/levels.js" onerror="this.remove()"><\/script><script src="data/reference/dictionary.js" onerror="this.remove()"><\/script>');
  }
</script>
<script>I18N.apply();</script>
<script src="game.js"></script>
<script src="editor.js"></script>
</body>
</html>
